<script>

/* =====================================================
   API URLS
===================================================== */


/* -----------------------------------------------------
   EMPLOYEE DATABASE API
----------------------------------------------------- */

const EMP_DATABASE_API =
"https://script.google.com/macros/s/AKfycbyyLBhj0uMPh-eaYdePAv2AUGuzlvL61jixeicF6Uu9-jDdL5BaMzWH5l0mSyXe6EDWWQ/exec";


/* -----------------------------------------------------
   SPECIAL TAG DATABASE API
----------------------------------------------------- */

const SPECIAL_TAG_API =
"https://script.google.com/macros/s/AKfycbxhhjGBkFEZvprIeh0IgdUeqCvX9b8Q69WffY9GFgaO4Bb2tVp7Qq7sVGvhrBS6-bQLug/exec";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let employeeDatabase = [];

let records = [];

let editIndex = -1;


/* =====================================================
   SHORT DOM
===================================================== */

const $ = function(id) {

    return document.getElementById(id);

};


/* =====================================================
   FORM FIELDS
===================================================== */

const fields = [

    "month",
    "cc",
    "metal",
    "tagNo",
    "product",
    "empId",
    "empName",
    "mgrId",
    "mgrName",
    "grWeight",
    "netWeight"

];


/* =====================================================
   EMPLOYEE ID INPUT
===================================================== */

$("empId").addEventListener(
    "input",
    function() {

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

        lookupEmployee();

    }
);


/* =====================================================
   MANAGER ID INPUT
===================================================== */

$("mgrId").addEventListener(
    "input",
    function() {

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

        lookupManager();

    }
);


/* =====================================================
   EMPLOYEE LOOKUP
===================================================== */

async function lookupEmployee() {

    const empId =
        $("empId").value.trim();


    $("empName").value = "";


    if (!empId) {

        $("empLoading")
            .classList
            .add("hidden");

        return;

    }


    $("empLoading")
        .classList
        .remove("hidden");


    const employee =
        findEmployeeById(
            empId
        );


    setTimeout(
        function() {

            $("empLoading")
                .classList
                .add("hidden");


            if (employee) {

                $("empName").value =
                    employee.employeeName || "";

            }

        },
        100
    );

}


/* =====================================================
   MANAGER LOOKUP
===================================================== */

async function lookupManager() {

    const mgrId =
        $("mgrId").value.trim();


    $("mgrName").value = "";


    if (!mgrId) {

        $("mgrLoading")
            .classList
            .add("hidden");

        return;

    }


    $("mgrLoading")
        .classList
        .remove("hidden");


    const manager =
        findEmployeeById(
            mgrId
        );


    setTimeout(
        function() {

            $("mgrLoading")
                .classList
                .add("hidden");


            if (manager) {

                $("mgrName").value =
                    manager.employeeName || "";

            }

        },
        100
    );

}


/* =====================================================
   LOAD EMPLOYEE DATABASE
===================================================== */

async function loadEmployeeDatabase() {

    try {

        const response =
            await fetch(
                EMP_DATABASE_API
            );


        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Employee Database:",
            result
        );


        if (!result.success) {

            throw new Error(
                result.error ||
                "Employee database error."
            );

        }


        employeeDatabase =
            Array.isArray(
                result.data
            )
                ? result.data
                : [];


        console.log(
            "Employee records loaded:",
            employeeDatabase.length
        );

    }


    catch(error) {

        console.error(
            "Employee database error:",
            error
        );

        employeeDatabase = [];

    }

}


/* =====================================================
   FIND EMPLOYEE BY ID
===================================================== */

function findEmployeeById(empId) {

    const searchId =
        String(
            empId || ""
        )
        .trim()
        .toLowerCase();


    if (!searchId) {

        return null;

    }


    return employeeDatabase.find(
        function(employee) {

            return String(
                employee.empId || ""
            )
            .trim()
            .toLowerCase()
            === searchId;

        }
    ) || null;

}


/* =====================================================
   WEIGHT FUNCTION
===================================================== */

function getWeight(id) {

    const value =
        $(id).value.trim();


    /* ---------------------------------------------------
       EMPTY IS ALLOWED
    --------------------------------------------------- */

    if (!value) {

        return "";

    }


    const number =
        Number(value);


    /* ---------------------------------------------------
       INVALID NUMBER
    --------------------------------------------------- */

    if (
        !Number.isFinite(number) ||
        number < 0
    ) {

        return "";

    }


    /* ---------------------------------------------------
       KEEP THE ORIGINAL USER INPUT
       
       Examples:
       2
       2.0
       2.000
       1.250
       0.000
       --------------------------------------------------- */

    return value;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value) {

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(m) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[m];

        }
    );

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text,
    type
) {

    const status =
        $("status");


    status.textContent =
        text;


    status.className =
        "status show mt-2 p-2 rounded text-[11px]";


    if (
        type === "success"
    ) {

        status.classList.add(
            "bg-green-100",
            "text-green-700"
        );

    }

    else if (
        type === "error"
    ) {

        status.classList.add(
            "bg-red-100",
            "text-red-700"
        );

    }

    else {

        status.classList.add(
            "bg-blue-100",
            "text-blue-700"
        );

    }


    setTimeout(
        function() {

            status.className =
                "status";

        },
        3000
    );

}


/* =====================================================
   GET FORM RECORD
===================================================== */

function getFormRecord() {

    return {

        month:
            $("month").value,

        cc:
            $("cc").value,

        metal:
            $("metal").value,

        tagNo:
            $("tagNo").value.trim(),

        product:
            $("product").value,

        empId:
            $("empId").value.trim(),

        empName:
            $("empName").value.trim(),

        mgrId:
            $("mgrId").value.trim(),

        mgrName:
            $("mgrName").value.trim(),

        grWeight:
            getWeight(
                "grWeight"
            ),

        netWeight:
            getWeight(
                "netWeight"
            ),

        addedAt:
            new Date().toISOString()

    };

}


/* =====================================================
   VALIDATE RECORD
===================================================== */

function validateRecord(record) {

    let valid = true;


    /* ---------------------------------------------------
       REMOVE OLD INVALID STATUS
    --------------------------------------------------- */

    fields.forEach(
        function(id) {

            $(id)
                .classList
                .remove("invalid");

        }
    );


    /* ---------------------------------------------------
       REQUIRED FIELDS
    --------------------------------------------------- */

    const required = [

        "month",
        "cc",
        "metal",
        "tagNo",
        "product",
        "empId",
        "empName",
        "mgrId",
        "mgrName"

    ];


    required.forEach(
        function(id) {

            if (
                !$(id).value.trim()
            ) {

                $(id)
                    .classList
                    .add("invalid");

                valid = false;

            }

        }
    );


    /* ---------------------------------------------------
       EMPLOYEE ID CHECK
    --------------------------------------------------- */

    if (
        record.empId &&
        !findEmployeeById(
            record.empId
        )
    ) {

        $("empId")
            .classList
            .add("invalid");

        $("empName")
            .classList
            .add("invalid");

        valid = false;

    }


    /* ---------------------------------------------------
       MANAGER ID CHECK
    --------------------------------------------------- */

    if (
        record.mgrId &&
        !findEmployeeById(
            record.mgrId
        )
    ) {

        $("mgrId")
            .classList
            .add("invalid");

        $("mgrName")
            .classList
            .add("invalid");

        valid = false;

    }


    /* ---------------------------------------------------
       GR WEIGHT
    --------------------------------------------------- */

    if (
        record.grWeight !== ""
    ) {

        const gr =
            Number(
                record.grWeight
            );


        if (
            !Number.isFinite(gr) ||
            gr < 0
        ) {

            $("grWeight")
                .classList
                .add("invalid");

            valid = false;

        }

    }


    /* ---------------------------------------------------
       NET WEIGHT
    --------------------------------------------------- */

    if (
        record.netWeight !== ""
    ) {

        const net =
            Number(
                record.netWeight
            );


        if (
            !Number.isFinite(net) ||
            net < 0
        ) {

            $("netWeight")
                .classList
                .add("invalid");

            valid = false;

        }

    }


    /* ---------------------------------------------------
       NET > GR CHECK
    --------------------------------------------------- */

    if (
        record.grWeight !== "" &&
        record.netWeight !== ""
    ) {

        const gr =
            Number(
                record.grWeight
            );


        const net =
            Number(
                record.netWeight
            );


        if (
            Number.isFinite(gr) &&
            Number.isFinite(net) &&
            net > gr
        ) {

            $("netWeight")
                .classList
                .add("invalid");


            showStatus(
                "Net Weight cannot be greater than Gr Weight.",
                "error"
            );


            valid = false;

        }

    }


    return valid;

}


/* =====================================================
   ADD / UPDATE RECORD
===================================================== */

function addRecord() {

    const record =
        getFormRecord();


    if (
        !validateRecord(
            record
        )
    ) {

        showStatus(
            "Please enter all required details correctly.",
            "error"
        );

        return;

    }


    /* ---------------------------------------------------
       UPDATE EXISTING RECORD
    --------------------------------------------------- */

    if (
        editIndex >= 0
    ) {

        records[editIndex] =
            record;


        editIndex = -1;


        $("addBtn").textContent =
            "ADD";


        showStatus(
            "Record updated successfully.",
            "success"
        );

    }


    /* ---------------------------------------------------
       ADD NEW RECORD
    --------------------------------------------------- */

    else {

        records.push(
            record
        );


        showStatus(
            "Record added to the right side.",
            "success"
        );

    }


    render();


    clearForm(false);

}


/* =====================================================
   RENDER TABLE
===================================================== */

function render() {

    const body =
        $("recordsBody");


    /* ---------------------------------------------------
       RECORD COUNT
    --------------------------------------------------- */

    $("count").textContent =
        records.length +
        " Record" +
        (
            records.length === 1
                ? ""
                : "s"
        );


    /* ---------------------------------------------------
       NO RECORDS
    --------------------------------------------------- */

    if (
        !records.length
    ) {

        body.innerHTML = `

        <tr>

        <td
        colspan="12"
        class="text-center py-8 text-gray-400 text-xs"
        >

        No records added.
        Enter details on the left and click ADD.

        </td>

        </tr>

        `;

        return;

    }


    /* ---------------------------------------------------
       CREATE TABLE
    --------------------------------------------------- */

    body.innerHTML =
        records.map(
            function(
                record,
                index
            ) {

                return `

                <tr
                class="${
                    index % 2 === 0
                    ? "bg-white"
                    : "bg-[#faf8f3]"
                } hover:bg-[#f5f0e5]"
                >

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.month)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.cc)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.metal)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.tagNo)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.product)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.empId)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.empName)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.mgrId)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.mgrName)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.grWeight)}
                </td>

                <td class="px-2 py-2 border-b text-[11px] whitespace-nowrap">
                    ${esc(record.netWeight)}
                </td>

                <td class="px-2 py-2 border-b text-center whitespace-nowrap">

                    <button
                    type="button"
                    title="Edit"
                    onclick="editRecord(${index})"
                    class="text-[#b17b12] text-base px-1"
                    >
                    ✏️
                    </button>

                    <button
                    type="button"
                    title="Delete"
                    onclick="deleteRecord(${index})"
                    class="text-red-700 text-base px-1"
                    >
                    🗑️
                    </button>

                </td>

                </tr>

                `;

            }
        )
        .join("");

}


/* =====================================================
   EDIT RECORD
===================================================== */

function editRecord(index) {

    const record =
        records[index];


    if (
        !record
    ) {

        return;

    }


    editIndex =
        index;


    $("month").value =
        record.month || "";


    $("cc").value =
        record.cc || "";


    $("metal").value =
        record.metal || "";


    $("tagNo").value =
        record.tagNo || "";


    $("product").value =
        record.product || "";


    $("empId").value =
        record.empId || "";


    $("empName").value =
        record.empName || "";


    $("mgrId").value =
        record.mgrId || "";


    $("mgrName").value =
        record.mgrName || "";


    $("grWeight").value =
        record.grWeight || "";


    $("netWeight").value =
        record.netWeight || "";


    $("addBtn").textContent =
        "UPDATE";


    showStatus(
        "Edit the details on the left, then click UPDATE.",
        "success"
    );

}


/* =====================================================
   DELETE RECORD
===================================================== */

function deleteRecord(index) {

    if (
        !records[index]
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this record?"
        );


    if (
        !confirmed
    ) {

        return;

    }


    records.splice(
        index,
        1
    );


    if (
        editIndex === index
    ) {

        editIndex = -1;


        $("addBtn").textContent =
            "ADD";


        clearForm(false);

    }

    else if (
        editIndex > index
    ) {

        editIndex--;

    }


    render();


    showStatus(
        "Record deleted successfully.",
        "success"
    );

}


/* =====================================================
   CLEAR FORM
===================================================== */
/* =====================================================
   CLEAR
   MONTH AND CC WILL REMAIN SELECTED
===================================================== */

function clearForm(
    showMessage = true
) {

    /*
       Save current Month and CC
       before clearing the other fields.
    */

    const selectedMonth =
        $("month").value;

    const selectedCC =
        $("cc").value;


    /*
       Clear all form fields
    */

    fields.forEach(
        function(id) {

            $(id).value = "";

            $(id)
                .classList
                .remove("invalid");

        }
    );


    /*
       Restore Month and CC
    */

    $("month").value =
        selectedMonth;

    $("cc").value =
        selectedCC;


    /*
       Reset edit mode
    */

    editIndex = -1;


    $("addBtn").textContent =
        "ADD";


    /*
       Remove loading messages
    */

    $("empLoading")
        .classList
        .add("hidden");

    $("mgrLoading")
        .classList
        .add("hidden");


    /*
       Optional success message
    */

    if(showMessage) {

        showStatus(
            "Input fields cleared. Month and CC remain selected.",
            "success"
        );

    }

}
/* =====================================================
   SAVE ALL
===================================================== */

async function saveAll() {

    /* ---------------------------------------------------
       CHECK RECORDS
    --------------------------------------------------- */

    if (
        !records.length
    ) {

        showStatus(
            "No records to save.",
            "error"
        );

        return;

    }


    /* ---------------------------------------------------
       BUTTON
    --------------------------------------------------- */

    const saveButton =
        $("saveAllBtn");


    saveButton.disabled =
        true;


    saveButton.textContent =
        "SAVING...";


    showStatus(
        "Saving all records...",
        "info"
    );


    try {

        /* -------------------------------------------------
           SEND TO APPS SCRIPT
        ------------------------------------------------- */

        const response =
            await fetch(
                SPECIAL_TAG_API,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "saveAll",

                            records:
                                records

                        })

                }
            );


        /* -------------------------------------------------
           HTTP CHECK
        ------------------------------------------------- */

        if (
            !response.ok
        ) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        /* -------------------------------------------------
           READ RESPONSE
        ------------------------------------------------- */

        const data =
            await response.json();


        console.log(
            "Save response:",
            data
        );


        /* -------------------------------------------------
           SERVER ERROR
        ------------------------------------------------- */

        if (
            data.success === false
        ) {

            throw new Error(
                data.error ||
                "Save failed."
            );

        }


        /* -------------------------------------------------
           SUCCESS
        ------------------------------------------------- */

        showStatus(
            data.message ||
            "All records saved successfully.",
            "success"
        );


        /* -------------------------------------------------
           CLEAR SAVED RECORDS
        ------------------------------------------------- */

        records = [];


        editIndex = -1;


        render();


        clearForm(false);

    }


    catch(error) {

        console.error(
            "Save error:",
            error
        );


        showStatus(
            error.message ||
            "Save failed. Check Apps Script deployment and URL.",
            "error"
        );

    }


    finally {

        saveButton.disabled =
            false;


        saveButton.textContent =
            "SAVE ALL";

    }

}


/* =====================================================
   ENTER KEY NAVIGATION
===================================================== */

const formFields =
    fields.map(
        function(id) {

            return $(id);

        }
    );


formFields.forEach(
    function(
        input,
        index
    ) {

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();


                    const next =
                        formFields[
                            index + 1
                        ];


                    if (
                        next
                    ) {

                        next.focus();

                    }

                    else {

                        $("addBtn")
                            .focus();

                    }

                }

            }
        );

    }
);



/* =========================================================
   DISABLE RIGHT CLICK / COMMON DEVTOOLS SHORTCUTS
========================================================= */

(function(){

    document.addEventListener(
        "contextmenu",
        function(e){

            e.preventDefault();

        }
    );


    document.addEventListener(
        "keydown",
        function(e){

            if(e.key === "F12"){

                e.preventDefault();

                return;

            }


            if(
                e.ctrlKey &&
                e.shiftKey &&
                e.key.toLowerCase() === "i"
            ){

                e.preventDefault();

                return;

            }


            if(
                e.ctrlKey &&
                e.shiftKey &&
                e.key.toLowerCase() === "j"
            ){

                e.preventDefault();

                return;

            }


            if(
                e.ctrlKey &&
                e.shiftKey &&
                e.key.toLowerCase() === "c"
            ){

                e.preventDefault();

                return;

            }


            if(
                e.ctrlKey &&
                e.key.toLowerCase() === "u"
            ){

                e.preventDefault();

                return;

            }

        }
    );

})();


/* =====================================================
   REMOVE INVALID ON INPUT
===================================================== */

document
.querySelectorAll(
    "input, select"
)
.forEach(
    function(input) {

        input.addEventListener(
            "input",
            function() {

                if (
                    this.value.trim()
                ) {

                    this.classList.remove(
                        "invalid"
                    );

                }

            }
        );


        input.addEventListener(
            "change",
            function() {

                if (
                    this.value.trim()
                ) {

                    this.classList.remove(
                        "invalid"
                    );

                }

            }
        );

    }
);


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadEmployeeDatabase();

        render();

    }
);
